# Évite que Supabase (plan gratuit) mette le projet en pause après 7 jours sans activité.
# Lit l'URL et la clé dans config.js : rien à reconfigurer quand on change de projet.
name: Ping Supabase

on:
  schedule:
    - cron: '17 6 * * 1,4'   # lundi et jeudi
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Requête vers l'API
        run: |
          URL=$(sed -n "s/.*SUPABASE_URL: *'\([^']*\)'.*/\1/p" config.js)
          KEY=$(sed -n "s/.*SUPABASE_KEY: *'\([^']*\)'.*/\1/p" config.js)
          curl --fail --silent --show-error "$URL/rest/v1/produits?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
